name: Build and Test React OCR Application

on:
  # Trigger on push to branch 'main'
  push:
    branches: [main]
  # Trigger on pull request from 'main'

jobs:
  build_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x, 14.x, 15.x]

    # Steps to build and test the react application
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{matrix.node-version}}
        uses: actions/setup@v2
        with:
          node-version: ${{matrix.node-version}}
      - name: npm setup, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm test
